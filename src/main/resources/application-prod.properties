# Production profile overrides.
# Activated ONLY when SPRING_PROFILES_ACTIVE=prod is set (Spring Boot then loads
# this file in addition to application.properties, with these values taking precedence).
#
# This file intentionally contains no secrets. Database credentials and other
# environment-specific values must still come from environment variables.

# --- Hardening: silence Hibernate SQL logging in production ---
spring.jpa.show-sql=false

# --- Hardening: disable Swagger/OpenAPI in production ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# NOTE: spring.jpa.hibernate.ddl-auto is intentionally NOT set here.
# It continues to inherit the existing value from application.properties.
# Do not enable "validate" until migration integrity and schema compatibility
# have been verified.
